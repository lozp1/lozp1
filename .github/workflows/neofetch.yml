name: Neofetch card

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - ".github/workflows/neofetch.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          # PROFILE_TOKEN (opcional): token personal de solo lectura para contar
          # tambien repos y contribuciones privadas. Sin el, solo cifras publicas.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/neofetch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || git commit -m "Update neofetch card"
          git push
